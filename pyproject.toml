[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hubspot-sdk"
version = "0.1.0"
description = "Async-first Python SDK and CLI for the HubSpot API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "HubSpot SDK Contributors" },
]
keywords = ["hubspot", "api", "sdk", "crm", "marketing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Framework :: AsyncIO",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "click>=8.0,<9",
    "rich>=13.0,<14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.34",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
hubspot = "cli.main:cli"

[project.urls]
Homepage = "https://github.com/hubspot-sdk/hubspot-sdk-python"
Documentation = "https://hubspot-sdk.readthedocs.io"

[tool.hatch.build.targets.wheel]
packages = ["src/hubspot_sdk", "cli"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
